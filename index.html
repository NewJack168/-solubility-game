<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>晶體射擊大作戰</title>

<style>

html,body{

  margin:0;

  width:100%;

  height:100%;

  overflow:hidden;

  background:#07111f;

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

  color:white;

}

canvas{

  display:block;

  width:100%;

  height:100%;

  touch-action:none;

}

#hud{

  position:absolute;

  top:12px;

  left:10px;

  right:10px;

  display:flex;

  justify-content:space-between;

  pointer-events:none;

}

.info{

  background:rgba(0,0,0,.5);

  padding:8px 12px;

  border-radius:15px;

  font-weight:bold;

}

.screen{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  background:rgba(0,0,0,.75);

  padding:20px;

}

.panel{

  width:min(90%,500px);

  background:#10264a;

  border-radius:25px;

  padding:25px;

  text-align:center;

}

button{

  width:100%;

  padding:15px;

  margin-top:12px;

  font-size:18px;

  font-weight:bold;

  border:0;

  border-radius:15px;

  background:#2f80ff;

  color:white;

}

.answer{

  background:#234671;

}

.hidden{

  display:none;

}

#hint{

  position:absolute;

  bottom:18px;

  width:100%;

  text-align:center;

  font-size:14px;

  opacity:.8;

  pointer-events:none;

}

#flash{

  position:absolute;

  inset:0;

  background:white;

  opacity:0;

  pointer-events:none;

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div class="info">🏆 <span id="score">0</span></div>

  <div class="info">🔥 <span id="combo">0</span></div>

  <div class="info">❤️ <span id="life">3</span></div>

</div>

<div id="hint">直接點怪物射擊！金色怪物有獎勵</div>

<div id="flash"></div>

<div id="start" class="screen">

  <div class="panel">

    <h1>🔫 晶體射擊大作戰</h1>

    <p>

      怪物正在入侵實驗室！<br><br>

      👆 點怪物射擊<br>

      🔥 連續擊殺增加 Combo<br>

      ⭐ 金色怪物可以加血<br>

      ⚡ 偶爾會出現簡單補給題

    </p>

    <button onclick="startGame()">開始戰鬥</button>

  </div>

</div>

<div id="quiz" class="screen hidden">

  <div class="panel">

    <h2>⚡ 能量補給</h2>

    <h2 id="question"></h2>

    <div id="answers"></div>

  </div>

</div>

<div id="over" class="screen hidden">

  <div class="panel">

    <h1>💥 GAME OVER</h1>

    <p>最後分數</p>

    <div id="final" style="font-size:60px;font-weight:bold"></div>

    <button onclick="startGame()">再玩一次</button>

  </div>

</div>

<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

let W=innerWidth;

let H=innerHeight;

function resize(){

  W=innerWidth;

  H=innerHeight;

  canvas.width=W;

  canvas.height=H;

}

resize();

addEventListener("resize",resize);

let enemies=[];

let particles=[];

let score=0;

let combo=0;

let life=3;

let kills=0;

let running=false;

let spawnTime=0;

let difficulty=850;

function updateHUD(){

  document.getElementById("score").textContent=score;

  document.getElementById("combo").textContent=combo;

  document.getElementById("life").textContent=life;

}

function startGame(){

  score=0;

  combo=0;

  life=3;

  kills=0;

  enemies=[];

  particles=[];

  difficulty=850;

  updateHUD();

  document.getElementById("start").classList.add("hidden");

  document.getElementById("over").classList.add("hidden");

  document.getElementById("quiz").classList.add("hidden");

  running=true;

  spawnTime=performance.now();

  requestAnimationFrame(loop);

}

function spawnEnemy(){

  const gold=Math.random()<0.12;

  enemies.push({

    x:40+Math.random()*(W-80),

    y:-40,

    r:gold?27:24+Math.random()*10,

    speed:1.4+Math.random()*1.5,

    gold:gold,

    move:Math.random()*6

  });

}

function explosion(x,y,color){

  for(let i=0;i<18;i++){

    const a=Math.random()*Math.PI*2;

    const s=1+Math.random()*4;

    particles.push({

      x:x,

      y:y,

      vx:Math.cos(a)*s,

      vy:Math.sin(a)*s,

      life:1,

      color:color

    });

  }

}

function flash(){

  const f=document.getElementById("flash");

  f.style.opacity=".8";

  setTimeout(()=>{

    f.style.opacity="0";

  },120);

}

canvas.addEventListener("pointerdown",function(e){

  if(!running)return;

  const x=e.clientX;

  const y=e.clientY;

  let hit=false;

  for(let i=enemies.length-1;i>=0;i--){

    const m=enemies[i];

    if(Math.hypot(x-m.x,y-m.y)<m.r*1.4){

      hit=true;

      combo++;

      kills++;

      if(m.gold){

        score+=80;

        life=Math.min(5,life+1);

        flash();

      }else{

        score+=10+Math.min(combo,20)*2;

      }

      explosion(

        m.x,

        m.y,

        m.gold?"gold":"cyan"

      );

      enemies.splice(i,1);

      updateHUD();

      if(kills%12===0){

        openQuiz();

      }

      if(kills%10===0){

        difficulty=Math.max(320,difficulty-70);

      }

      break;

    }

  }

  if(!hit){

    combo=0;

    updateHUD();

  }

});

const quizList=[

  {

    q:"糖放進水裡看不見了，比較像哪一個？",

    a:["溶解","燃燒"],

    c:0

  },

  {

    q:"糖通常在哪種水中溶得比較快？",

    a:["熱水","冰水"],

    c:0

  },

  {

    q:"汽水打開後冒出的泡泡是？",

    a:["氣體","石頭"],

    c:0

  },

  {

    q:"水已經溶不下更多鹽，叫做？",

    a:["飽和","結冰"],

    c:0

  }

];

function openQuiz(){

  running=false;

  const q=quizList[

    Math.floor(Math.random()*quizList.length)

  ];

  document.getElementById("question").textContent=q.q;

  const box=document.getElementById("answers");

  box.innerHTML="";

  q.a.forEach((text,index)=>{

    const b=document.createElement("button");

    b.className="answer";

    b.textContent=text;

    b.onclick=function(){

      document.getElementById("quiz").classList.add("hidden");

      if(index===q.c){

        score+=100;

        enemies.forEach(m=>{

          explosion(m.x,m.y,"gold");

        });

        enemies=[];

        flash();

      }else{

        combo=0;

      }

      updateHUD();

      running=true;

      spawnTime=performance.now();

      requestAnimationFrame(loop);

    };

    box.appendChild(b);

  });

  document.getElementById("quiz").classList.remove("hidden");

}

function gameOver(){

  running=false;

  document.getElementById("final").textContent=score;

  document.getElementById("over").classList.remove("hidden");

}

function loop(t){

  if(!running)return;

  ctx.fillStyle="#07111f";

  ctx.fillRect(0,0,W,H);

  // 星空

  for(let i=0;i<60;i++){

    ctx.fillStyle="rgba(255,255,255,.35)";

    ctx.fillRect(

      (i*83)%W,

      (i*57+t*.02)%H,

      2,

      2

    );

  }

  if(t-spawnTime>difficulty){

    spawnEnemy();

    spawnTime=t;

  }

  // 怪物

  for(let i=enemies.length-1;i>=0;i--){

    const m=enemies[i];

    m.move+=.03;

    m.x+=Math.sin(m.move)*.6;

    m.y+=m.speed;

    ctx.shadowBlur=20;

    ctx.shadowColor=m.gold?"gold":"cyan";

    ctx.fillStyle=m.gold?"#ffca28":"#2997ff";

    ctx.beginPath();

    ctx.arc(

      m.x,

      m.y,

      m.r,

      0,

      Math.PI*2

    );

    ctx.fill();

    ctx.shadowBlur=0;

    // 眼睛

    ctx.fillStyle="#06111f";

    ctx.beginPath();

    ctx.arc(m.x-8,m.y-5,3,0,Math.PI*2);

    ctx.arc(m.x+8,m.y-5,3,0,Math.PI*2);

    ctx.fill();

    // 嘴巴

    ctx.strokeStyle="#06111f";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(

      m.x,

      m.y+7,

      8,

      Math.PI,

      0

    );

    ctx.stroke();

    if(m.gold){

      ctx.fillStyle="white";

      ctx.font="20px sans-serif";

      ctx.textAlign="center";

      ctx.fillText(

        "★",

        m.x,

        m.y+7

      );

    }

    if(m.y>H+50){

      enemies.splice(i,1);

      life--;

      combo=0;

      updateHUD();

      if(life<=0){

        gameOver();

        return;

      }

    }

  }

  // 爆炸粒子

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx;

    p.y+=p.vy;

    p.life-=.035;

    ctx.globalAlpha=Math.max(0,p.life);

    ctx.fillStyle=p.color;

    ctx.beginPath();

    ctx.arc(

      p.x,

      p.y,

      4,

      0,

      Math.PI*2

    );

    ctx.fill();

    ctx.globalAlpha=1;

    if(p.life<=0){

      particles.splice(i,1);

    }

  }

  // 玩家砲台

  ctx.fillStyle="#a8ddff";

  ctx.beginPath();

  ctx.arc(

    W/2,

    H-20,

    28,

    Math.PI,

    0

  );

  ctx.fill();

  ctx.fillStyle="#2997ff";

  ctx.fillRect(

    W/2-6,

    H-55,

    12,

    35

  );

  requestAnimationFrame(loop);

}

</script>

</body>

</html>
